name: Validate HarrTest skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate layout
        run: |
          python -c "from pathlib import Path; s=Path('SKILL.md').read_text(encoding='utf-8'); assert s.splitlines()[:2] == ['---', 'name: harrtest']; assert Path('agents/openai.yaml').is_file(); assert Path('scripts/workflow.py').is_file(); assert Path('visual/banner.svg').is_file()"
      - name: Unit and actual CLI workflow regressions
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Matched comparison against v3.2.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: python -B scripts/golden_benchmark.py --output "$RUNNER_TEMP/harrtest-gold-comparison"
      - name: Package complete installable skill
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('.')
          sys.path.insert(0, str(root / 'scripts'))
          from install import package_ignores
          with ZipFile('skill.zip', 'w', ZIP_DEFLATED) as archive:
              for directory, children, files in os.walk(root, followlinks=False):
                  ignored = package_ignores(directory, children + files)
                  for name in set(children + files) - ignored:
                      file = Path(directory) / name
                      if file.is_symlink():
                          raise RuntimeError('Refuse symlink in published skill: ' + str(file))
                  children[:] = sorted(set(children) - ignored)
                  for name in sorted(set(files) - ignored):
                      file = Path(directory) / name
                      archive.write(file, 'harrtest/' + file.as_posix())
          with ZipFile('skill.zip') as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              for required in ('SKILL.md', 'scripts/proof.py', 'scripts/root_gate.py', 'scripts/workflow.py', 'scripts/runtime_store.py', 'scripts/coverage.py', 'scripts/builder.py', 'references/project-builder.md', 'references/v3.2.2-validation.md', 'tests/test_evidence_ordering.py', '.github/workflows/verify.yml', 'agents/openai.yaml', 'scripts/golden.py', 'scripts/golden_benchmark.py', 'references/v4-gold.md', 'references/v4-validation.md', 'visual/banner.svg', 'scripts/team.py', 'references/production-teams.md', 'tests/test_team.py', 'tests/test_team_integration.py', 'scripts/corporate.py', 'scripts/team_v2.py', 'assets/templates/root-contract-v4.json', 'references/corporate-workflow.md'):
                  assert 'harrtest/' + required in names, required
              assert 'harrtest/scripts/corporate_benchmark.py' not in names
              assert 'harrtest/tests/test_corporate_benchmark.py' not in names
              assert not any(name.startswith('harrtest/assets/corporate/') for name in names)
              for required in ('scripts/mission.py', 'assets/templates/mission.json',
                               'references/feature-preservation-and-completion.md', 'tests/test_mission.py'):
                  assert 'harrtest/' + required in names, required
          PY
      - name: Upload complete skill ZIP
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: harrtest-skill
          path: skill.zip
          if-no-files-found: error
