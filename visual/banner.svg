<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HarrTest 4.0 Gold</title>
  <desc id="desc">A warm black and gold banner. One request branches into three work streams, passes separate checks and converges on a final verification.</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="14"/>
    </clipPath>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 11v2m-1-1h2" fill="none" stroke="#4d3515" stroke-opacity=".21"/>
    </pattern>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffe5a2"/>
      <stop offset="1" stop-color="#e1ab46"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#181612"/>
    <path d="M696 0h504v360H696z" fill="url(#gold)"/>
    <path d="M696 0h504v360H696z" fill="url(#paper-grid)"/>
    <path d="M696 0h3v360h-3z" fill="#fff1c9" opacity=".75"/>
    <path d="M63 70h569M63 292h569" fill="none" stroke="#5d5442"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="63" y="112" fill="#f2ce74" font-size="32" font-weight="700" letter-spacing="3">VERSION 4.0 / GOLD</text>
      <text x="57" y="224" fill="#fff5df" font-size="123" font-weight="700" letter-spacing="-6">HarrTest</text>
      <text x="63" y="267" fill="#ded2b7" font-size="36">Evidence for decisions and results</text>
    </g>

    <g fill="none" stroke="#493311" stroke-opacity=".34">
      <path d="M747 72V52h22m379 20V52h-22M747 288v20h22m379-20v20h-22"/>
      <path d="M747 100h401m-401 160h401" stroke-dasharray="2 6"/>
      <path d="M870 80v200m86-200v200" stroke-dasharray="2 6"/>
    </g>

    <g fill="none" stroke="#32240f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M753 180h357"/>
      <path d="M779 180h13c29 0 35-80 65-80h116c30 0 36 80 65 80h30"/>
      <path d="M779 180h13c29 0 35 80 65 80h116c30 0 36-80 65-80h30"/>
    </g>
    <circle cx="753" cy="180" r="10" fill="#32240f"/>
    <g fill="#32240f">
      <circle cx="870" cy="100" r="10"/>
      <circle cx="870" cy="180" r="10"/>
      <circle cx="870" cy="260" r="10"/>
    </g>
    <g fill="#f5cc72" stroke="#32240f" stroke-width="3.5">
      <path d="m956 87 13 13-13 13-13-13z"/>
      <path d="m956 167 13 13-13 13-13-13z"/>
      <path d="m956 247 13 13-13 13-13-13z"/>
    </g>
    <rect x="1077" y="146" width="68" height="68" rx="12" fill="#21180d"/>
    <path d="m1094 179 12 12 23-25" fill="none" stroke="#ffdf8d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="13.5" fill="none" stroke="#ad8744" stroke-opacity=".45"/>
</svg>
